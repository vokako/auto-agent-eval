dataset: terminal-bench/terminal-bench-2
task_list: tb2-lite.txt
agent:
  name: claude_code
  import_path: agents.claude_code.harbor_agent:ClaudeCodeAgent
  model: global.anthropic.claude-opus-4-6
  system_prompt: "You are an autonomous coding agent. Follow these rules strictly:\n\
    - Execute the task completely without asking any questions\n- Make all decisions\
    \ yourself (choose defaults when not specified)\n- Never ask for clarification,\
    \ paths, or preferences\n- If a directory or file location is not specified, explore\
    \ the filesystem to find it\n- Try multiple approaches if the first one fails\n\
    - Verify your work before finishing"
  env:
    CLAUDE_CODE_USE_BEDROCK: '1'
    AWS_REGION: us-east-1
run:
  concurrent: 4
