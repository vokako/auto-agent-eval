[project]
name = "aae"
version = "0.3.0"
description = "Agent evaluation framework on Harbor/Terminal-Bench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "harbor",
]

[project.scripts]
aae = "aae.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aae"]
