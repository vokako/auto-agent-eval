[project]
name = "aae"
version = "0.2.0"
description = "Terminal-Bench evaluation extension with Agent-as-Judge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "terminal-bench>=0.2.18",
]

[project.scripts]
aae = "aae.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aae"]
